<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Loader</title>

<style>
body{
    background:#111;
    text-align:center;
    margin-top:120px;
    font-family:Arial;
}

/* الدائرة */
.loader {
    border: 10px solid #333;
    border-top: 10px solid #1e90ff;
    border-radius: 50%;
    width: 120px;
    height: 120px;
    animation: spin 1s linear infinite;
    margin: auto;
}

/* علامة الصح بسيطة */
.check {
    display: none;
    font-size: 100px;
    color: #00ff66;
    margin-top: 20px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div id="loader" class="loader"></div>
<div id="check" class="check">✔</div>

<script>
function cycle(){

    let loader = document.getElementById("loader");
    let check = document.getElementById("check");

    loader.style.display = "block";
    check.style.display = "none";

    setTimeout(()=>{
        loader.style.display = "none";
        check.style.display = "block";

        setTimeout(()=>{
            cycle();
        }, 10000);

    }, 3000);
}

window.onload = cycle;
</script>

</body>
</html>
