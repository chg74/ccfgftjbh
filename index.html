<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIDS TV</title>

<style>
body{
margin:0;
background:black;
overflow:hidden;
font-family:Tahoma;
}

/* شاشة الإيقاف */
#tvOff{
position:fixed;
width:100%;
height:100%;
background:black;
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.offText{
color:white;
font-size:35px;
font-weight:bold;
}

/* المشغل */
.player{
position:relative;
width:100%;
height:100vh;
background:black;
overflow:hidden;
}

/* iframe */
iframe{
width:100%;
height:100vh;
border:none;
}

/* اللوجو */
.logoBox{
position:absolute;
top:35%;
right:20px;
z-index:99999;
pointer-events:none;
}

.logo{
width:60px;
height:60px;
object-fit:contain;

filter:
drop-shadow(0 0 6px black)
drop-shadow(0 0 12px black);
}
</style>
</head>

<body>

<!-- شاشة الإيقاف -->
<div id="tvOff">
<div class="offText">
📺 القناة غير شغالة الآن
</div>
</div>

<!-- المشغل -->
<div class="player">

<div class="logoBox">
<img id="logo" class="logo" src="">
</div>

<iframe id="frame" allow="autoplay; fullscreen" allowfullscreen></iframe>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyAUc2cH9gVE7RECiW19XQXjNZQxVH96sFE",
authDomain: "zezo-59a8d.firebaseapp.com",
databaseURL: "https://zezo-59a8d-default-rtdb.firebaseio.com",
projectId: "zezo-59a8d",
storageBucket: "zezo-59a8d.appspot.com",
messagingSenderId: "49183098248",
appId: "1:49183098248:web:37e3fb16744042a1bb263d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const frame = document.getElementById("frame");

/* مشاهدة */
const userRef = db.ref("watching/" + Math.random().toString(36).substr(2,9));
userRef.set(true);
userRef.onDisconnect().remove();

/* متابعة الحالة */
db.ref("kids-tv").on("value",(snap)=>{

const data = snap.val();

/* لو مش شغال أو مفيش رابط */
if(!data || data.status == false || !data.url){

document.getElementById("tvOff").style.display="flex";
frame.style.display="none";
frame.src = ""; // يمنع 404

return;
}

/* لو شغال */
document.getElementById("tvOff").style.display="none";
frame.style.display="block";

frame.src = data.url;

/* اللوجو */
document.getElementById("logo").src = data.logo;

});

</script>

</body>
</html>
