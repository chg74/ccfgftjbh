<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تم الإرسال بنجاح</title>

<style>
body{
    margin:0;
    padding:0;
    background:#0f1115;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial, sans-serif;
}

/* الكارد */
.box{
    background:#161b22;
    width:320px;
    padding:40px 30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,0,0,0.4);
}

/* دائرة التحميل */
.loader{
    border:8px solid rgba(255,255,255,0.08);
    border-top:8px solid #00c3ff;
    border-radius:50%;
    width:90px;
    height:90px;
    margin:auto;
    animation:spin 1s linear infinite;
}

/* علامة الصح */
.success{
    display:none;
    width:100px;
    height:100px;
    margin:auto;
    border-radius:50%;
    background:rgba(0,255,120,0.08);
    border:2px solid rgba(0,255,120,0.25);
    box-shadow:0 0 20px rgba(0,255,120,0.15);
    justify-content:center;
    align-items:center;
    font-size:55px;
    color:#00ff88;
}

/* النص */
.title{
    color:white;
    font-size:24px;
    margin-top:25px;
    font-weight:bold;
}

.desc{
    color:#b8c1cc;
    font-size:15px;
    margin-top:10px;
    line-height:1.6;
}

@keyframes spin{
    0%{
        transform:rotate(0deg);
    }
    100%{
        transform:rotate(360deg);
    }
}
</style>
</head>
<body>

<div class="box">

    <div id="loader" class="loader"></div>

    <div id="success" class="success">
        ✔
    </div>

    <div id="title" class="title">
        جاري الإرسال...
    </div>

    <div id="desc" class="desc">
        الرجاء الانتظار قليلاً حتى يتم تنفيذ العملية بنجاح
    </div>

</div>

<script>
function cycle(){

    let loader = document.getElementById("loader");
    let success = document.getElementById("success");
    let title = document.getElementById("title");
    let desc = document.getElementById("desc");

    loader.style.display = "block";
    success.style.display = "none";

    title.innerHTML = "... جاري الإرسال";
    desc.innerHTML = "الرجاء الانتظار قليلاً حتى يتم تنفيذ العملية بنجاح";

    setTimeout(() => {

        loader.style.display = "none";
        success.style.display = "flex";

        title.innerHTML = "تم الإرسال بنجاح";
        desc.innerHTML = "تم تنفيذ العملية بنجاح وسيتم تحديث البيانات تلقائياً";

        setTimeout(() => {
            cycle();
        }, 10000);

    }, 3000);
}

window.onload = cycle;
</script>

</body>
</html>
