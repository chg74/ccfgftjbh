<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جاري الانتظار</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#f8f8f8;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
}

/* الدائرة زي الصورة */
.loader{
    width:58px;
    height:58px;
    border:4px solid #e6e6e6;
    border-top:4px solid #4a67ff;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 18px;
}

/* علامة الصح زي الصورة */
.success{
    display:none;
    width:62px;
    height:62px;
    background:#2dbf4f;
    border-radius:50%;
    position:relative;
    margin:0 auto 18px;
}

.success::after{
    content:"✓";
    color:white;
    font-size:42px;
    font-weight:bold;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-55%);
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

/* الكلام */
.text{
    font-size:22px;
    color:#222;
    font-weight:500;
    letter-spacing:0;
}
</style>
</head>
<body>

<div class="container">
    <div class="loader" id="loader"></div>
    <div class="success" id="success"></div>
    <div class="text" id="status">جاري الانتظار...</div>
</div>

<script>
setTimeout(function(){
    document.getElementById("loader").style.display = "none";
    document.getElementById("success").style.display = "block";
    document.getElementById("status").innerText = "تم التأكيد بنجاح";
},4000);
</script>

</body>
</html>
